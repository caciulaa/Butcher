# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
# x.y.z, optionally -alpha or -beta. With a .autobump file in the folder, build.gradle
# bumps the patch after every successful build. Raise major or minor by hand for a
# release; the suffix (or its absence) is kept. 0.4.0 is the launch.
mod_version=0.4.0
maven_group=com.butcher
archives_base_name=butcher

# Dependencies
fabric_api_version=0.152.1+26.2
